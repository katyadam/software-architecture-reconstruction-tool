services:
  cm_neo4j:
    image: neo4j:latest
    container_name: cm_neo4j
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # BOLT

  sdg_neo4j:
    image: neo4j:latest
    container_name: sdg_neo4j
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7475:7474"
      - "7688:7687"

  imcg_neo4j:
    image: neo4j:latest
    container_name: imcg_neo4j
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7476:7474"
      - "7689:7687"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "8333:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: accesskey
      MINIO_ROOT_PASSWORD: secretkey
      MINIO_BUCKETS: "code-elements"
    volumes:
      - ../data/minio:/data
