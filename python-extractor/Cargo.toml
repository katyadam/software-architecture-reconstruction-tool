[package]
name = "python-extractor"
version = "0.1.0"
edition = "2024"

[dependencies]
tree-sitter = "0.25.7"
tree-sitter-python = "0.23.6"
regex = "1.11.1"
sha2 = "0.10.9"
once_cell = "1.21.3"

# API
actix-web = "4.11.0"
tokio = { version = "1.46.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
env_logger = "0.11.8"
log = "0.4.27"
utoipa = { version = "5.4.0", features = ["macros", "actix_extras", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
dotenvy = "0.15"
uuid = { version = "1.17.0", features = ["serde", "v4"] }
actix-multipart = "0.7.2"
futures-util = "0.3"
awc = "3.7.0" 
thiserror = "2.0.3"
chrono = { version = "0.4", features = ["serde"] }

models = { path = "../models" }