[package]
name = "constant-scanner"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4.12.0"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
env_logger = "0.11.8"
log = "0.4.29"
utoipa = { version = "5.4.0", features = ["macros", "actix_extras", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
dotenvy = "0.15"
uuid = { version = "1.12.0", features = ["serde", "v4"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
diesel = { version = "2.3.6", features = ["postgres", "uuid", "chrono", "r2d2", "serde_json"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2.0.18"
r2d2 = "0.8.10"