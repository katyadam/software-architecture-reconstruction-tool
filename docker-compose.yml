services:
  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    image: manager:latest
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgresql://postgres:password@localhost:5432/manager-db
    ports:
      - 8081:8081
    depends_on:
      - manager-db

  python-extractor:
    build:
      context: .
      dockerfile: ./python-extractor/Dockerfile
    image: python-extractor:latest
    environment:
      - MANAGER_URL=http://localhost:8081
      - SYNTHESIZER_URL=http://localhost:8080
    ports:
      - 8082:8082
    depends_on:
      - manager
      - synthesizer

  synthesizer:
    build:
      context: .
      dockerfile: ./synthesizer/Dockerfile
    image: synthesizer:latest
    environment:
      - CM_NEO4J_URI=127.0.0.1:7687
      - CM_NEO4J_USERNAME=neo4j
      - CM_NEO4J_PASSWORD=password
      - SDG_NEO4J_URI=127.0.0.1:7688
      - SDG_NEO4J_USERNAME=neo4j
      - SDG_NEO4J_PASSWORD=password
      - IMCG_NEO4J_URI=127.0.0.1:7689
      - IMCG_NEO4J_USERNAME=neo4j
      - IMCG_NEO4J_PASSWORD=password
    ports:
      - 8080:8080
    depends_on:
      - cm_neo4j
      - sdg_neo4j
      - imcg_neo4j

  cm_neo4j:
    image: neo4j:latest
    container_name: cm_neo4j
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # BOLT

  sdg_neo4j:
    image: neo4j:latest
    container_name: sdg_neo4j
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7475:7474"
      - "7688:7687"

  imcg_neo4j:
    image: neo4j:latest
    container_name: imcg_neo4j
    environment:
      NEO4J_AUTH: "neo4j/password"
    ports:
      - "7476:7474"
      - "7689:7687"

  manager-db:
    image: postgres:16
    container_name: manager-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: manager-db
    ports:
      - "5432:5432"
    volumes:
      - manager-db-data:/var/lib/postgresql/data

volumes:
  manager-db-data:
